# Demo data for the landing page dashboard demo (app/assets/demo/JobJournal-demo.html).
#
# Regenerate the demo after editing this file:
#
#   bin/rails demo:dashboard
#
# Nothing here is saved: the records are created inside a database transaction,
# rendered through the real dashboard, and rolled back.
#
# Times are relative to the demo's "now" (see `now` below), in the app's time
# zone. Supported formats:
#
#   now
#   today at 09:00
#   3 days ago
#   3 days ago at 14:30
#   in 2 days at 17:16
#
# "3 days ago" without a time keeps the time of day from `now`.
#
# The dashboard's counts are computed from these records, so changing dates can
# move leads and interviews between sections. Weeks start on Sunday
# (config.beginning_of_week), and the numbers below assume the defaults for
# follow-up (7/2/3 days), stale (7 days), and archiving settings.

# The demo is always rendered as if it's this weekday and time in the current
# week, so the "this week" / "last week" stats stay the same no matter which day
# you regenerate it.
now:
  weekday: tuesday
  time: "15:00"

user:
  name: Braden Roth
  email: demo@jobjournal.app # shown in the sidebar of the screenshots
  settings:
    appearance:
      layout: grid
      style: cards
    goals:
      weekly_applications: 10

